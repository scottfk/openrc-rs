[package]
name = "openrc-applets"
description = "The openrc-rs multi-call binary: einfo, checkpath, and (eventually) the rest of OpenRC's programs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "openrc_applets"
path = "src/lib.rs"

[[bin]]
name = "openrc-rs"
path = "src/main.rs"

[dependencies]
openrc-compat.workspace = true
openrc-einfo.workspace = true
openrc-rc.workspace = true

[features]
# PAM sessions for daemons run as another user, and PAM in openrc-user
# (upstream's -Dpam=true).
pam = ["openrc-compat/pam"]

[lints]
workspace = true

[dev-dependencies]
libc.workspace = true
